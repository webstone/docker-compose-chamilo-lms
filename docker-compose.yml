services:
  mariadb:
    image: mariadb:11.4
    container_name: ${MARIADB_CONTAINER:-chamilo2-mariadb}
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_USER=${MYSQL_USER:-chamilo2}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-chamilo2}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-chamilo2}
      - MYSQL_INITDB_SKIP_TZINFO=yes
    volumes:
      - ${MARIADB_DATA_PATH:-./data/mariadb}:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      "project.id": "docker.compose.chamilo2-mariadb"
      "project.github.url": "https://github.com/webstone/docker-compose-chamilo-lms"
    networks:
      - chamilo2_network

  chamilo:
    build:
      context: ./chamilo2-php8
      target: ${CHAMILO_BUILD_TARGET:-php8_apache_chamilo2}
      args:
        - PHP_VERSION=${PHP_VERSION:-8.2.30}
        - CHAMILO_VERSION=${CHAMILO_VERSION:-2.0.0-RC.1}
    image: ${DOCKER_IMAGE_NAME:-chamilo2-php8:latest}
    container_name: ${CHAMILO_CONTAINER:-chamilo2-php8}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ${CHAMILO_ROOT_PATH:-./data/chamilo}:/var/www/chamilo
    ports:
      - "${CHAMILO_PORT:-8080}:80"
    extra_hosts:
      - "docker.chamilo.net:127.0.0.1"
    environment: &chamilo_environment
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-1}
      - DATABASE_URL=mysql://${MYSQL_USER:-chamilo2}:${MYSQL_PASSWORD:-chamilo2}@mariadb:3306/${MYSQL_DATABASE:-chamilo2}
    restart: unless-stopped
    labels:
      "project.id": "docker.compose.chamilo2-php8"
      "project.github.url": "https://github.com/chamilo/chamilo-lms"
    networks:
      - chamilo2_network

  # Optional PHP 8.3 runtime on the same source tree and database, for
  # testing PHP upgrades side by side: docker compose --profile php83 up -d
  chamilo-php83:
    profiles: ["php83"]
    build:
      context: ./chamilo2-php8
      target: php8_apache_runtime
      args:
        - PHP_VERSION=${PHP83_VERSION:-8.3}
    image: ${PHP83_IMAGE_NAME:-chamilo2-php83:latest}
    container_name: ${PHP83_CONTAINER:-chamilo2-php83}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ${CHAMILO_ROOT_PATH:-./data/chamilo}:/var/www/chamilo
    ports:
      - "${PHP83_PORT:-8081}:80"
    extra_hosts:
      - "docker.chamilo.net:127.0.0.1"
    environment: *chamilo_environment
    restart: unless-stopped
    labels:
      "project.id": "docker.compose.chamilo2-php83"
      "project.github.url": "https://github.com/chamilo/chamilo-lms"
    networks:
      - chamilo2_network

  # Browser test stack (Behat + Selenium): docker compose --profile test up -d
  # chamilo-behat serves the same source tree on PHP 8.3, but with its own
  # .env, JWT keys, var/ directories and database, so a fresh test install
  # never touches the development platform.
  chamilo-behat:
    profiles: ["test"]
    build:
      context: ./chamilo2-php8
      target: php8_apache_runtime
      args:
        - PHP_VERSION=${PHP83_VERSION:-8.3}
    image: ${PHP83_IMAGE_NAME:-chamilo2-php83:latest}
    container_name: ${BEHAT_CONTAINER:-chamilo2-behat}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ${CHAMILO_ROOT_PATH:-./data/chamilo}:/var/www/chamilo
      - ${BEHAT_DATA_PATH:-./data/behat}/.env:/var/www/chamilo/.env
      - ${BEHAT_DATA_PATH:-./data/behat}/jwt:/var/www/chamilo/config/jwt
      # Upstream's default authentication config instead of the OWC one,
      # which forces OAuth login and hides the username/password form
      - ${BEHAT_DATA_PATH:-./data/behat}/authentication.yaml:/var/www/chamilo/config/authentication.yaml
      - ${BEHAT_DATA_PATH:-./data/behat}/var/cache:/var/www/chamilo/var/cache
      - ${BEHAT_DATA_PATH:-./data/behat}/var/log:/var/www/chamilo/var/log
      - ${BEHAT_DATA_PATH:-./data/behat}/var/sessions:/var/www/chamilo/var/sessions
      - ${BEHAT_DATA_PATH:-./data/behat}/var/upload:/var/www/chamilo/var/upload
      - ${BEHAT_DATA_PATH:-./data/behat}/var/search:/var/www/chamilo/var/search
    ports:
      - "${BEHAT_PORT:-8082}:80"
    environment:
      # The shared config/authentication.yaml references the OWC OAuth
      # provider; the test platform does not use it, but the variables must exist
      OAUTH_LARAVEL_CLIENT_ID: ""
      OAUTH_LARAVEL_CLIENT_SECRET: ""
      OAUTH_LARAVEL_AUTHORIZE_URL: ""
      OAUTH_LARAVEL_TOKEN_URL: ""
      OAUTH_LARAVEL_USER_URL: ""
    restart: "no"
    labels:
      "project.id": "docker.compose.chamilo2-behat"
    networks:
      - chamilo2_network

  selenium:
    profiles: ["test"]
    # Pinned to the Selenium 4.1 line upstream's Behat CI uses: Chamilo's
    # Mink driver (instaclick/php-webdriver 1.4) only sends legacy JSON Wire
    # desiredCapabilities, which newer Selenium releases no longer translate
    image: ${SELENIUM_IMAGE:-selenium/standalone-chrome:4.1.3-20220405}
    container_name: ${SELENIUM_CONTAINER:-chamilo2-selenium}
    shm_size: 2gb
    environment:
      - SE_NODE_MAX_SESSIONS=1
    # Share chamilo-behat's network namespace: tests/behat/behat.yml expects
    # Selenium on 127.0.0.1:4444 and the platform on http://localhost, which
    # then hold for both the Behat runner and the browser without overrides.
    # The browser runs headless (tests/behat/behat.yml), so no VNC ports are
    # published
    network_mode: "service:chamilo-behat"
    depends_on:
      - chamilo-behat
    restart: "no"
    labels:
      "project.id": "docker.compose.chamilo2-selenium"

networks:
  chamilo2_network:
    driver: bridge
    name: ${DOCKER_NETWORK:-chamilo2-network}
