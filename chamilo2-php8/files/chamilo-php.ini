; Chamilo-specific overrides on top of php.ini-production, matching the
; recommendations on Administration > System status > PHP.

output_buffering = On
max_execution_time = 300
max_input_time = 300
session.gc_maxlifetime = 4320

; php.ini-production defaults to GPCS, which leaves $_ENV empty. Keep the
; environment in $_ENV: the container passes APP_ENV and friends as real
; environment variables, and Chamilo reads $_ENV directly in places.
variables_order = "EGPCS"
